name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Test
        run: go test ./...

      - name: Validate and check rendered views are up to date
        run: |
          go run ./cmd/majorchanges
          git diff --exit-code -- werf.md nelm.md
