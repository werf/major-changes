# Products the catalogue renders a view for, and the git ranges whose every commit the ledgers account for.
# To extend the catalogue to newer commits, move a range's `new` pin and run `task sync`.
products:
  - name: werf
    title: "werf v2 → v3: changes"
    output: werf.md
  - name: nelm
    title: "Nelm v1 → v2: changes"
    output: nelm.md

