id: cli-werf-helm-deploy-commands-removed
title: "`werf helm` no longer has install, upgrade, template, lint, uninstall, rollback and test subcommands"
type: removal
breaking: true
products: [werf]
domain: deploy
areas: [cli, charts]
description: |
  Before: werf embedded the Helm 3 CLI with werf chart extensions: `werf helm install`, `werf helm upgrade`, `werf helm template` and `werf helm lint` rendered charts with werf service values stubs, secret values (`--secret-values`), `--add-annotation`/`--add-label` and `--env`, and `werf helm uninstall`, `werf helm rollback` and `werf helm test` worked on releases like their Helm 3 counterparts.
  Now: these subcommands are removed. `werf helm` keeps only chart, repository and registry commands (`create`, `dependency`, `env`, `package`, `pull`, `registry`, `repo`, `search`, `show`, `verify`, `version`) and the werf-specific `secret`, `get-autogenerated-values`, `get-namespace` and `get-release`.
migration: |
  Deploy and inspect charts with werf's own commands: `werf converge` instead of `werf helm install`/`upgrade`, `werf render` instead of `werf helm template`, `werf lint` instead of `werf helm lint`, `werf dismiss` instead of `werf helm uninstall`, `werf rollback` instead of `werf helm rollback`, `werf plan` to preview changes. For bundles use `werf bundle apply`/`render`/`plan`. For plain charts without a werf project use `nelm release install`, `nelm chart render`, `nelm chart lint`, `nelm release uninstall`, `nelm release rollback`, or the upstream Helm CLI. `werf helm test` has no werf replacement: run `helm test` with the upstream Helm CLI.
