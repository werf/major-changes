id: cli-werf-helm-release-inspection-commands-removed
title: "`werf helm` no longer has get, history, list and status subcommands"
type: removal
breaking: true
products: [werf]
domain: deploy
areas: [cli, release-storage]
description: |
  Before: `werf helm get` with its subcommands (`all`, `hooks`, `manifest`, `notes`, `values` and others), `werf helm history`, `werf helm list` and `werf helm status` inspected releases like their Helm 3 counterparts.
  Now: these subcommands are removed from `werf helm`.
migration: |
  Use `werf release list`, `werf release history` and `werf release get` (or `nelm release list`, `nelm release history`, `nelm release get`) to inspect releases: `werf release get --release NAME --namespace NAMESPACE` replaces `werf helm get` and `werf helm status`.
