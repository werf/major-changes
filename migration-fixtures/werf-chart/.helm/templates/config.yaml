apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  motd: {{ .Files.Get "files/motd.txt" | quote }}
  environment: {{ .Values.global.env | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
stringData:
  db-password: {{ .Values.db.password | quote }}
  api-token: {{ .Values.api.token | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-credentials
  annotations:
    werf.io/sensitive: "true"
data:
  token: {{ .Values.api.token | quote }}
